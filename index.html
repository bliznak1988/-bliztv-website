<script>
const BOT_TOKEN = "ТУКА_ГО_СТАВИ_BOT_TOKEN";
const CHAT_ID = "ТУКА_ГО_СТАВИ_CHAT_ID";

const chatButton = document.getElementById("chat-button");
const chatBox = document.getElementById("chat-box");
const sendButton = document.getElementById("chat-send");
const messageBox = document.getElementById("chat-message");
const status = document.getElementById("chat-status");

chatButton.onclick = () => {
  chatBox.style.display =
    chatBox.style.display === "block" ? "none" : "block";
};

sendButton.onclick = async () => {
  const message = messageBox.value.trim();

  if (!message) {
    status.textContent = "Write a message first.";
    return;
  }

  status.textContent = "Sending...";

  const text = "📩 New message from BlizTv website:\n\n" + message;

  try {
    const response = await fetch(
      `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: text,
        }),
      }
    );

    const result = await response.json();

    if (result.ok) {
      status.textContent = "Message sent! ✅";
      messageBox.value = "";
    } else {
      status.textContent = "Error sending message.";
    }
  } catch {
    status.textContent = "Connection error.";
  }
};
</script>
